<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Dot mask -->
    <mask id="dotMask">
      <!-- White = visible area -->
      <rect width="100%" height="100%" fill="white"/>

      <!-- Black = transparent holes (dots) -->
      <pattern id="dots" width="3" height="3" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.5" fill="black"/>
      </pattern>

      <rect width="100%" height="100%" fill="url(#dots)"/>
    </mask>
  </defs>

  <!-- Background color with holes -->
  <rect width="100%" height="100%" fill="black" mask="url(#dotMask)"/>
</svg>